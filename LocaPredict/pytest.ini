[pytest]
pythonpath = .
testpaths = backend/tests
python_files = test_*.py
addopts = -v
markers =
    calibration: calibrated-risk and reliability checks (Gate 4)
    fidelity: SHAP TreeExplainer fidelity checks (Gate 5)
    backtest: forecast rolling-origin backtest checks (Gate 5)
    security: RBAC, auth-hardening and secret-scan checks (Gate 6)
    audit: audit-trail completeness checks (Gate 6)
